<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL modificator | Zero friction</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-titles">
                <h1 class="title-header">Make it simple and quickly</h1>
                <h2 class="sub-tittle-header">Make your link shorter and modify the URL, create QR codes, track your links and view visits and more. All of that free or paying one time, AVOID MENSUAL SUSCRIPTON.</h2>
            </div>

            <!-- Formulario -->
            <div class="input-box">
                <form>
                    <input type="text" class="input-url-box" id="inputURL" placeholder="URL here">
                    <input type="text" class="input-slug-box" id="customSlug" placeholder="Your custom slug">
                    <button type="button" class="input-btn-process" id="btnProcess">Short & Change URL</button>
                </form>
            </div>

            <!-- Resultado -->
            <div class="result-box">
                <input type="text" class="result-text-box" id="result" placeholder="result" readonly>
                <button type="button" class="result-btn-copy" id="btnCopy">❐</button>
            </div>

            <!-- QR Section (Corregido 'if' por 'id') -->
            <div id="imgBox">
                <img src="" id="QRimg">
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
